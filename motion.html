<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guide Robot Motion</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main id="display-area">
        <div class="display-header">
            <div class="display-header-left">
                <div class="robot-indicator">
                    <span class="pulse-ring"></span>
                    <span class="pulse-dot"></span>
                </div>
                <span class="display-label">Guide Robot Motion Control</span>
            </div>
            <div class="display-header-right">
                <a class="header-link" href="/">Display</a>
                <span id="motion-state" class="demo-state">Ready</span>
            </div>
        </div>

        <section class="motion-stage">
            <div class="motion-copy">
                <h1>Motion Commands</h1>
                <p id="motion-output">Select a motion command to send a placeholder serial payload.</p>
            </div>
        </section>

        <section class="motion-controls" aria-label="Motion commands">
            {% for motion in motions %}
            <button type="button" class="demo-action-btn motion-action-btn" data-motion-id="{{ motion.id }}">
                <span class="demo-action-title">{{ motion.label }}</span>
            </button>
            {% endfor %}
        </section>
    </main>

    <script src="/static/motion.js"></script>
</body>
</html>
