<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guide Robot Local AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="display-area">
        <div class="display-header">
            <div class="display-header-left">
                <div class="robot-indicator">
                    <span class="pulse-ring"></span>
                    <span class="pulse-dot"></span>
                </div>
                <span class="display-label">Guide Robot Local AI</span>
            </div>
            <div class="display-header-right">
                <button type="button" id="speaker-toggle" class="header-link speaker-toggle">Speaker: Laptop</button>
                <a class="header-link" href="/">Display</a>
                <span id="local-ai-state" class="demo-state">Ready</span>
            </div>
        </div>

        <section class="local-ai-panel">
            <form id="local-ai-form" class="local-ai-form">
                <textarea id="local-ai-input" rows="4" placeholder="Enter English prompt..."></textarea>
                <button type="submit" class="demo-action-btn local-ai-send-btn">
                    <span class="demo-action-title">Send</span>
                </button>
            </form>

            <div class="local-ai-response-box">
                <div id="local-ai-output">Local AI response will stream here.</div>
                <span class="stream-cursor" id="local-ai-cursor"></span>
            </div>
        </section>
    </main>

    <script src="local_ai.js"></script>
</body>
</html>
